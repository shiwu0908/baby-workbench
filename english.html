<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>宝宝英语启蒙台</title>
<style>
:root{--primary:#7C5CFC;--primary-light:#D4C9FF;--bg:#f5f3ff;--card:#fff;--text:#3d3d3d;--text-light:#888;--border:#e8e0f0;--radius:16px;--radius-sm:10px;--shadow:0 2px 12px rgba(0,0,0,.06);--shadow-hover:0 4px 20px rgba(0,0,0,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:80px}
.app-header{background:linear-gradient(135deg,#7C5CFC,#9B7FFF);color:#fff;padding:20px 16px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 10px rgba(124,92,252,.2)}
.app-header h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.app-header .subtitle{font-size:12px;opacity:.9;margin-top:2px}
.back-btn{position:absolute;top:18px;right:16px;background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0 env(safe-area-inset-bottom,8px);border-top:1px solid var(--border);z-index:100;max-width:600px;margin:0 auto;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.nav-item{flex:1;text-align:center;padding:6px 4px;cursor:pointer;color:var(--text-light);font-size:11px;transition:color .2s;-webkit-tap-highlight-color:transparent}
.nav-item .nav-icon{font-size:20px;display:block;margin-bottom:2px}
.nav-item.active{color:var(--primary);font-weight:600}
.page{display:none;max-width:600px;margin:0 auto;padding:16px;animation:fadeIn .3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.theme-banner{border-radius:var(--radius);padding:20px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.theme-banner-content{display:flex;align-items:center;gap:16px}
.theme-banner-icon{font-size:40px}
.theme-banner-label{font-size:12px;opacity:.85}
.theme-banner-name{font-size:22px;font-weight:700;margin:2px 0}
.theme-banner-desc{font-size:13px;opacity:.9}
.theme-banner-date{position:absolute;top:16px;right:20px;font-size:12px;background:rgba(255,255,255,.25);padding:4px 10px;border-radius:20px}
.section-title{font-size:16px;font-weight:700;margin:20px 0 12px}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:var(--radius-sm);padding:14px;box-shadow:var(--shadow)}
.stat-label{font-size:12px;color:var(--text-light);margin-bottom:4px}
.stat-value{font-size:28px;font-weight:700;color:var(--primary)}
.stat-total{font-size:14px;color:var(--text-light);font-weight:400}
.stat-bar{height:6px;background:#ede8f5;border-radius:3px;margin-top:8px;overflow:hidden}
.stat-bar-fill{height:100%;background:var(--primary);border-radius:3px;transition:width .5s ease}
.vocab-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;transition:all .25s;border:2px solid transparent}
.vocab-card.completed{border-color:#81C784;background:#f8fbf8}
.vocab-card-header{display:flex;align-items:center;gap:12px;padding:14px;border-left:4px solid var(--primary)}
.vocab-word{font-size:22px;font-weight:700;color:var(--primary);flex:1}
.vocab-meaning{font-size:14px;color:var(--text-light)}
.vocab-check{width:28px;height:28px;border-radius:50%;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0;transition:all .2s}
.vocab-check.checked{background:#66BB6A;border-color:#66BB6A}
.vocab-card-body{padding:0 14px 14px}
.vocab-phrase{font-size:16px;font-weight:600;margin-bottom:4px;color:var(--primary)}
.vocab-scene{font-size:13px;color:#555;line-height:1.5;margin-bottom:8px}
.vocab-meta{display:flex;flex-wrap:wrap;gap:6px}
.vocab-tag{background:#f5f3ff;padding:3px 8px;border-radius:6px;font-size:11px;color:#666}
.song-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.song-title{font-size:16px;font-weight:700;color:var(--primary)}
.song-title-cn{font-size:13px;color:var(--text-light);margin-bottom:8px}
.song-lyrics{font-size:13px;color:#555;line-height:1.6;background:#f9f7ff;padding:10px;border-radius:8px;margin-bottom:8px;font-style:italic}
.song-actions{font-size:12px;color:#666;margin-bottom:6px}
.song-meta{display:flex;gap:8px}
.song-tag{font-size:10px;background:var(--primary-light);color:var(--primary);padding:3px 8px;border-radius:6px}
.scene-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.scene-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.scene-icon{font-size:24px}
.scene-title{font-size:16px;font-weight:700}
.phrase-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0e8f5}
.phrase-row:last-child{border-bottom:none}
.phrase-en{font-size:15px;font-weight:600;color:var(--primary);flex:1}
.phrase-cn{font-size:13px;color:#555}
.phrase-ctx{font-size:11px;color:var(--text-light);margin-top:2px}
.game-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;border-left:4px solid var(--primary)}
.game-title{font-size:16px;font-weight:700;margin-bottom:4px}
.game-how{font-size:13px;color:#555;line-height:1.5;margin-bottom:8px}
.game-english{font-size:12px;color:var(--primary);background:#f5f3ff;padding:8px;border-radius:6px;margin-bottom:6px;font-style:italic}
.game-meta{display:flex;flex-wrap:wrap;gap:6px}
.game-tag{font-size:11px;background:#f5f3ff;padding:3px 8px;border-radius:6px;color:#666}
.principles-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.principle-chip{display:flex;align-items:center;gap:6px;background:#fff;padding:8px 12px;border-radius:20px;box-shadow:var(--shadow);white-space:nowrap;flex-shrink:0;font-size:12px}
.page-header{margin-bottom:16px}
.page-header h2{font-size:20px;font-weight:700}
.page-header p{font-size:13px;color:var(--text-light);margin-top:4px}
.vocab-list{display:flex;flex-direction:column;gap:0}
.filter-bar{background:#fff;border-radius:var(--radius-sm);padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
.filter-label{font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:6px}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.filter-chip{border:1px solid var(--border);background:#fff;padding:5px 12px;border-radius:16px;font-size:12px;cursor:pointer;color:var(--text);transition:all .2s;-webkit-tap-highlight-color:transparent}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.speak-btn{background:var(--primary);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;-webkit-tap-highlight-color:transparent}
.speak-btn:active{transform:scale(.9);background:#6B4CE0}
.speak-btn.speaking{animation:pulse .8s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.vocab-card-header .speak-btn{margin-left:8px}
.phrase-speak{background:var(--primary-light);color:var(--primary);border:none;width:28px;height:28px;border-radius:50%;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.phrase-speak:active{transform:scale(.9)}
.song-speak-btn{background:var(--primary);color:#fff;border:none;padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;margin-top:8px;-webkit-tap-highlight-color:transparent}
.game-speak-btn{background:var(--primary-light);color:var(--primary);border:none;padding:4px 10px;border-radius:12px;font-size:11px;cursor:pointer;margin-top:6px;-webkit-tap-highlight-color:transparent}

.yt-container{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;margin-top:10px;background:#000}
.yt-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.yt-play-btn{background:#7C5CFC;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;margin-top:8px;display:inline-flex;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent}
.yt-play-btn:active{transform:scale(.95)}

.check-btn{width:28px;height:28px;border-radius:50%;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0;transition:all .2s;cursor:pointer;-webkit-tap-highlight-color:transparent}
.check-btn.checked{background:#66BB6A;border-color:#66BB6A}
.check-btn:active{transform:scale(.85)}
.song-card.done-card,.scene-card.done-card,.game-card.done-card{border:2px solid #81C784;background:#f8fbf8}
.daily-note{font-size:12px;color:var(--text-light);margin:-4px 0 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.done-tip{font-size:12px;color:#66BB6A;font-weight:600;margin-top:6px}
.song-check-row{display:flex;gap:8px;margin-top:8px;align-items:center}
.song-check-row .yt-play-btn{margin-top:0}
.scene-header .check-btn{margin-left:auto}
.game-check-row{display:flex;gap:8px;margin-top:6px;align-items:center}
.game-check-row .game-speak-btn{margin-top:0}

</style>
</head>

// ===== 语音合成功能 =====
let _voices = [];
let _enVoice = null;
function _loadVoices() {
  _voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  _enVoice = _voices.find(v => v.lang.startsWith('en') && v.name.includes('Samantha')) ||
             _voices.find(v => v.lang.startsWith('en') && v.name.includes('Google')) ||
             _voices.find(v => v.lang === 'en-US') ||
             _voices.find(v => v.lang.startsWith('en')) || null;
}
if (window.speechSynthesis) {
  _loadVoices();
  window.speechSynthesis.onvoiceschanged = _loadVoices;
}

function speak(text, btn) {
  if (!window.speechSynthesis) { alert('当前浏览器不支持语音播放'); return; }
  window.speechSynthesis.cancel(); // 停止上一个

  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.8;   // 稍慢，适合宝宝磨耳朵
  u.pitch = 1.2;  // 稍高，更亲切
  u.volume = 1;
  if (_enVoice) u.voice = _enVoice;

  if (btn) {
    btn.classList.add('speaking');
    u.onend = () => btn.classList.remove('speaking');
    u.onerror = () => btn.classList.remove('speaking');
  }
  window.speechSynthesis.speak(u);
}

function speakMany(texts, btn) {
  if (!window.speechSynthesis) { alert('当前浏览器不支持语音播放'); return; }
  window.speechSynthesis.cancel();
  if (btn) btn.classList.add('speaking');
  let idx = 0;
  function next() {
    if (idx >= texts.length) {
      if (btn) btn.classList.remove('speaking');
      return;
    }
    const u = new SpeechSynthesisUtterance(texts[idx]);
    u.lang = 'en-US'; u.rate = 0.8; u.pitch = 1.2; u.volume = 1;
    if (_enVoice) u.voice = _enVoice;
    u.onend = () => { idx++; setTimeout(next, 400); };
    u.onerror = () => { if (btn) btn.classList.remove('speaking'); };
    window.speechSynthesis.speak(u);
  }
  next();
}

const App = {
  state: { currentDate:null, completed:{} },
  init() {
    const t=new Date(); const y=t.getFullYear(); const m=String(t.getMonth()+1).padStart(2,'0'); const d=String(t.getDate()).padStart(2,'0');
    this.state.currentDate = y+'-'+m+'-'+d;
    this.renderAgeSubtitle();
    this.loadState();
    this.renderAll();
  },
  renderAgeSubtitle() {
    const el=document.getElementById('enAgeSubtitle'); if(!el) return;
    const birth=new Date(DATA.meta.birthDate+'T00:00:00');
    const today=new Date(this.state.currentDate+'T00:00:00');
    let months=(today.getFullYear()-birth.getFullYear())*12+(today.getMonth()-birth.getMonth());
    if(today.getDate()<birth.getDate()) months--;
    if(months<0) months=0;
    const lastBday=new Date(today.getFullYear(),today.getMonth()+(today.getDate()>=birth.getDate()?0:-1),birth.getDate());
    const daysInAge=Math.round((today-lastBday)/86400000);
    el.textContent=`${months}月龄${daysInAge}天 · 每日更新 · 中英主题同步`;
  },
  loadState() { try { const s=localStorage.getItem('elw_en_state'); if(s){ this.state.completed=JSON.parse(s).completed||{}; } } catch(e){} },
  saveState() { try { localStorage.setItem('elw_en_state', JSON.stringify({completed:this.state.completed})); } catch(e){} },
  getThemeIndex() {
    const anchor=new Date('2026-08-17'); const today=new Date(this.state.currentDate);
    const diff=Math.floor((today-anchor)/(1000*60*60*24)); const wi=Math.floor(diff/7);
    const themes=DATA.weeklyThemes; return ((wi%themes.length)+themes.length)%themes.length;
  },
  getCurrentTheme() { return DATA.weeklyThemes[this.getThemeIndex()]; },
  getDayIndex() {
    const anchor=new Date('2026-08-17'); const today=new Date(this.state.currentDate);
    return Math.floor((today-anchor)/(1000*60*60*24));
  },
  // 每日词汇：滚动复习，每天前进1个词，连续取3个，8天一循环（1新2旧）
  getTodayVocab() {
    const theme=this.getCurrentTheme(); const words=DATA.vocabulary[theme.id]||[];
    if(!words.length) return [];
    const dayIdx=this.getDayIndex();
    return [0,1,2].map(i=>({...words[(dayIdx+i)%words.length]}));
  },
  // 每日儿歌：1首本周主题轮换 + 1首全库错开轮换（主题歌不足时自动补全库）
  getTodaySongs() {
    const theme=this.getCurrentTheme(); const dayIdx=this.getDayIndex();
    const themeSongs=DATA.songs.filter(s=>s.themes.includes(theme.id));
    const list=[];
    if(themeSongs.length) list.push(themeSongs[dayIdx%themeSongs.length]);
    const pool=DATA.songs.filter(s=>!list.find(x=>x.id===s.id));
    const need=themeSongs.length>=2?1:2-list.length; // 至少凑满2首
    for(let i=0;i<need && pool.length;i++){
      const s=pool[(dayIdx*5+3+i*3)%pool.length];
      if(!list.find(x=>x.id===s.id)) list.push(s);
    }
    return list;
  },
  // 每日场景：6大场景每天轮换1个
  getTodayScene() {
    const dayIdx=this.getDayIndex();
    return DATA.scenes[dayIdx%DATA.scenes.length];
  },
  // 每日游戏：1个本周主题轮换 + 1个全库错开轮换
  getTodayGames() {
    const theme=this.getCurrentTheme(); const dayIdx=this.getDayIndex();
    const themeGames=DATA.games.filter(g=>g.theme===theme.id);
    const list=[];
    if(themeGames.length) list.push(themeGames[dayIdx%themeGames.length]);
    const pool=DATA.games.filter(g=>!list.find(x=>x.id===g.id));
    if(pool.length) list.push(pool[(dayIdx*7+5)%pool.length]);
    return list;
  },
  isDone(id) { return !!(this.state.completed[this.state.currentDate]||{})[id]; },
  toggle(id) {
    if(!this.state.completed[this.state.currentDate]) this.state.completed[this.state.currentDate]={};
    const d=this.state.completed[this.state.currentDate];
    if(d[id]) delete d[id]; else d[id]={at:new Date().toISOString()};
    this.saveState(); this.renderToday();
  },
  getStats() {
    const vocab=this.getTodayVocab(); const songs=this.getTodaySongs();
    const scene=this.getTodayScene(); const games=this.getTodayGames();
    const ids=[
      ...vocab.map(w=>w.word),
      ...songs.map(s=>'song:'+s.id),
      'scene:'+(scene?scene.id:''),
      ...games.map(g=>'game:'+g.id)
    ].filter(Boolean);
    const done=ids.filter(id=>this.isDone(id)).length;
    const vocabDone=vocab.filter(w=>this.isDone(w.word)).length;
    return {total:ids.length,done,percent:ids.length?Math.round(done/ids.length*100):0,vocabDone,vocabTotal:vocab.length};
  },
  renderAll() { this.renderToday(); this.renderVocab(); this.renderSongs(); this.renderScenes(); this.renderGames(); },
  renderToday() {
    const c=document.getElementById('todayContent'); if(!c) return;
    const theme=this.getCurrentTheme();
    const vocab=this.getTodayVocab(); const songs=this.getTodaySongs();
    const scene=this.getTodayScene(); const games=this.getTodayGames();
    const stats=this.getStats();
    const dayIdx=this.getDayIndex(); const weekDay=((dayIdx%7)+7)%7+1;
    const allDone=stats.total>0&&stats.done>=stats.total;
    const dateObj=new Date(this.state.currentDate);
    const wd=['日','一','二','三','四','五','六'];
    let html=`
      <div class="theme-banner" style="background:linear-gradient(135deg,${theme.color},${theme.color}dd);">
        <div class="theme-banner-content">
          <div class="theme-banner-icon">${theme.icon}</div>
          <div>
            <div class="theme-banner-label">本周英语主题</div>
            <div class="theme-banner-name">${theme.name}</div>
            <div class="theme-banner-desc">${theme.desc}</div>
          </div>
        </div>
        <div class="theme-banner-date">${dateObj.getMonth()+1}月${dateObj.getDate()}日 周${wd[dateObj.getDay()]} · 本周第${weekDay}天</div>
      </div>
      <div class="daily-note">🔄 <b>每日自动更新</b> · 启用第${dayIdx+1}天 · 词汇滚动复习 · 儿歌/场景/游戏每日轮换</div>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-label">今日任务（词汇+儿歌+对话+游戏）</div><div class="stat-value" ${allDone?'style="color:#66BB6A"':''}>${stats.done}<span class="stat-total">/${stats.total}</span></div><div class="stat-bar"><div class="stat-bar-fill" style="width:${stats.percent}%;${allDone?'background:#66BB6A':''}"></div></div>${allDone?'<div class="done-tip">🎉 今日全部完成，宝宝超棒！</div>':''}</div>
        <div class="stat-card"><div class="stat-label">今日词汇</div><div class="stat-value">${stats.vocabDone}<span class="stat-total">/${stats.vocabTotal}</span></div><div class="stat-bar"><div class="stat-bar-fill" style="width:${stats.vocabTotal?Math.round(stats.vocabDone/stats.vocabTotal*100):0}%"></div></div></div>
      </div>`;
    html+=`<div class="section-title">📖 今日词汇（滚动复习 · 1新2旧）</div>`;
    for(const w of vocab) {
      const done=this.isDone(w.word);
      html+=`<div class="vocab-card ${done?'completed':''}">
        <div class="vocab-card-header" style="border-left-color:${theme.color}">
          <div><div class="vocab-word">${w.word}</div><div class="vocab-meaning">${w.meaning}</div></div>
          <button class="speak-btn" onclick="event.stopPropagation();speak('${w.word}',this)">🔊</button>
          <div class="vocab-check ${done?'checked':''}" onclick="event.stopPropagation();App.toggle('${w.word}')">${done?'✓':''}</div>
        </div>
        <div class="vocab-card-body">
          <div class="vocab-phrase" style="color:${theme.color}" onclick="event.stopPropagation();speak('${w.phrase}',this)">💬 ${w.phrase} <span style="font-size:12px;opacity:.6">👆点击朗读</span></div>
          <div class="vocab-scene">📍 ${w.scene}</div>
          <div class="vocab-meta">${w.materials&&w.materials.length?`<span class="vocab-tag">🧰 ${w.materials.join('、')}</span>`:''}</div>
        </div>
      </div>`;
    }
    html+=`<div class="section-title">🎵 今日儿歌（每天轮换2首）</div>`;
    for(const s of songs) {
      const sid='song:'+s.id; const done=this.isDone(sid);
      html+=`<div class="song-card ${done?'done-card':''}">
        <div class="song-title">${s.title} ${done?'<span style="color:#66BB6A">✓</span>':''}</div>
        <div class="song-title-cn">${s.titleCn}</div>
        <div class="song-lyrics">${s.lyrics}</div>
        <div class="song-actions">👐 动作：${s.actions}</div>
        <div class="song-check-row">
          <button class="yt-play-btn" onclick="playSong('${s.id}')">🎵 播放歌曲</button>
          <button class="song-speak-btn" onclick="speakMany([\'${s.lyrics.replace(/,/g,"','").replace(/'/g,"\\'")}\'],this)">🔊 朗读歌词</button>
          <div class="check-btn ${done?'checked':''}" onclick="App.toggle('${sid}')">${done?'✓':''}</div>
        </div>
      </div>`;
    }
    if(scene) {
      const scid='scene:'+scene.id; const done=this.isDone(scid);
      html+=`<div class="section-title">💬 今日场景对话（每天轮换1个场景）</div>
      <div class="scene-card ${done?'done-card':''}">
        <div class="scene-header"><span class="scene-icon">${scene.icon}</span><span class="scene-title">${scene.title}</span><div class="check-btn ${done?'checked':''}" onclick="App.toggle('${scid}')">${done?'✓':''}</div></div>`;
      for(const p of scene.phrases) {
        html+=`<div class="phrase-row">
          <div style="flex:1;cursor:pointer" onclick="speak('${p.en.replace(/'/g,"\\'")}',this)">
            <div class="phrase-en">${p.en} <span style="font-size:12px;opacity:.5">🔊</span></div>
            <div class="phrase-cn">${p.cn}</div>
            <div class="phrase-ctx">${p.context}</div>
          </div>
        </div>`;
      }
      html+=`</div>`;
    }
    html+=`<div class="section-title">🎮 今日互动游戏（每天轮换2个）</div>`;
    for(const g of games) {
      const gid='game:'+g.id; const done=this.isDone(gid);
      html+=`<div class="game-card ${done?'done-card':''}" style="border-left-color:${theme.color}">
        <div class="game-title">${g.title} ${done?'<span style="color:#66BB6A">✓</span>':''}</div>
        <div class="game-how">${g.how}</div>
        <div class="game-english">${g.english}</div>
        <div class="game-check-row">
          <button class="game-speak-btn" onclick="speak('${g.english.replace(/'/g,"\\'").replace(/\//g," ")}',this)">🔊 朗读英文</button>
          <div class="check-btn ${done?'checked':''}" onclick="App.toggle('${gid}')">${done?'✓':''}</div>
        </div>
        <div class="game-meta">
          <span class="game-tag">⏱ ${g.duration}</span>
          <span class="game-tag">🧰 ${g.materials.join('、')||'无需材料'}</span>
        </div>
      </div>`;
    }
    html+=`<div class="section-title">🌟 磨耳朵原则</div>
    <div class="principles-strip">
      <div class="principle-chip"><span>👂</span>只磨耳朵不认读</div>
      <div class="principle-chip"><span>🤫</span>不跟读不强迫</div>
      <div class="principle-chip"><span>🏠</span>融入日常场景</div>
      <div class="principle-chip"><span>👶</span>建立画面对应</div>
      <div class="principle-chip"><span>💛</span>无压力输入</div>
    </div>`;
    c.innerHTML=html;
  },
  renderVocab() {
    const c=document.getElementById('vocabContent'); if(!c) return;
    let html='<div class="page-header"><h2>📖 词汇库</h2><p>7大主题 · 每周一个主题 · 每日滚动复习</p></div>';
    for(const theme of DATA.weeklyThemes) {
      const words=DATA.vocabulary[theme.id]||[];
      html+=`<div class="section-title" style="color:${theme.color}">${theme.icon} ${theme.name}</div>`;
      for(const w of words) {
        html+=`<div class="vocab-card" style="margin-bottom:8px">
          <div class="vocab-card-header" style="border-left-color:${theme.color};padding:10px 14px">
            <div><span class="vocab-word" style="font-size:18px">${w.word}</span> <span class="vocab-meaning">${w.meaning}</span></div>
            <button class="speak-btn" onclick="event.stopPropagation();speak('${w.word}',this)">🔊</button>
          </div>
          <div class="vocab-card-body" style="padding:0 14px 10px">
            <div class="vocab-phrase" style="color:${theme.color};font-size:14px" onclick="speak('${w.phrase}',this)">💬 ${w.phrase} <span style="font-size:11px;opacity:.6">👆朗读</span></div>
            <div class="vocab-scene" style="font-size:12px">📍 ${w.scene}</div>
          </div>
        </div>`;
      }
    }
    // 常备词汇：家庭成员（不进周轮换，随时用）
    const familyWords=DATA.vocabulary.family||[];
    if(familyWords.length){
      html+=`<div class="section-title" style="color:#E8B14A">🏡 家庭成员（常备词汇）</div>`;
      for(const w of familyWords) {
        html+=`<div class="vocab-card" style="margin-bottom:8px">
          <div class="vocab-card-header" style="border-left-color:#E8B14A;padding:10px 14px">
            <div><span class="vocab-word" style="font-size:18px">${w.word}</span> <span class="vocab-meaning">${w.meaning}</span></div>
            <button class="speak-btn" onclick="event.stopPropagation();speak('${w.word}',this)">🔊</button>
          </div>
          <div class="vocab-card-body" style="padding:0 14px 10px">
            <div class="vocab-phrase" style="color:#E8B14A;font-size:14px" onclick="speak('${w.phrase}',this)">💬 ${w.phrase} <span style="font-size:11px;opacity:.6">👆朗读</span></div>
            <div class="vocab-scene" style="font-size:12px">📍 ${w.scene}</div>
          </div>
        </div>`;
      }
    }
    c.innerHTML=html;
  },
  renderSongs() {
    const c=document.getElementById('songsContent'); if(!c) return;
    let html='<div class="page-header"><h2>🎵 磨耳朵儿歌库</h2><p>12首经典英文儿歌，配互动动作</p></div>';
    for(const s of DATA.songs) {
      
      html+=`<div class="song-card">
        <div class="song-title">${s.title}</div>
        <div class="song-title-cn">${s.titleCn}</div>
        <div class="song-lyrics">${s.lyrics}</div>
        <div class="song-actions">👐 动作：${s.actions}</div>
        <div class="song-meta">
          <span class="song-tag">⏱ ${s.duration}</span>
          ${s.themes.map(t=>{const th=DATA.weeklyThemes.find(x=>x.id===t);return th?`<span class="song-tag">${th.icon} ${th.name.split(' ')[0]}</span>`:'';}).join('')}
        </div>
        <button class="yt-play-btn" onclick="playSong('${s.id}')">🎵 播放歌曲</button>
        <button class="song-speak-btn" onclick="speakMany([\'${s.lyrics.replace(/,/g,"','").replace(/'/g,"\'")}\'],this)">🔊 朗读歌词</button>
      </div>`;
    }
    c.innerHTML=html;
  },
  renderScenes() {
    const c=document.getElementById('scenesContent'); if(!c) return;
    let html='<div class="page-header"><h2>💬 日常场景对话</h2><p>6大生活场景，全程英文短句输入</p></div>';
    for(const sc of DATA.scenes) {
      html+=`<div class="scene-card">
        <div class="scene-header"><span class="scene-icon">${sc.icon}</span><span class="scene-title">${sc.title}</span></div>`;
      for(const p of sc.phrases) {
        html+=`<div class="phrase-row">
          <div style="flex:1;cursor:pointer" onclick="speak('${p.en.replace(/'/g,"\'")}',this)">
            <div class="phrase-en">${p.en} <span style="font-size:12px;opacity:.5">🔊</span></div>
            <div class="phrase-cn">${p.cn}</div>
            <div class="phrase-ctx">${p.context}</div>
          </div>
        </div>`;
      }
      html+=`</div>`;
    }
    c.innerHTML=html;
  },
  renderGames() {
    const c=document.getElementById('gamesContent'); if(!c) return;
    let html='<div class="page-header"><h2>🎮 互动游戏库</h2><p>12个英语互动小游戏，实物操作磨耳朵</p></div>';
    for(const g of DATA.games) {
      const theme=DATA.weeklyThemes.find(t=>t.id===g.theme);
      html+=`<div class="game-card" style="border-left-color:${theme?theme.color:'var(--primary)'}">
        <div class="game-title">${g.title}</div>
        <div class="game-how">${g.how}</div>
        <div class="game-english">${g.english}</div>
        <button class="game-speak-btn" onclick="speak('${g.english.replace(/'/g,"\'").replace(/\//g," ")}',this)">🔊 朗读英文</button>
        <div class="game-meta">
          <span class="game-tag">⏱ ${g.duration}</span>
          <span class="game-tag">🧰 ${g.materials.join('、')||'无需材料'}</span>
          ${theme?`<span class="game-tag">${theme.icon} ${theme.name.split(' ')[0]}</span>`:''}
        </div>
      </div>`;
    }
    c.innerHTML=html;
  }
};

function showPage(id) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelector('.nav-item[data-page="'+id+'"]')?.classList.add('active');
}
function goBack() {
  window.location.href = 'index.html';
}
document.addEventListener('DOMContentLoaded',()=>App.init());
</script>
</body>
</html>
